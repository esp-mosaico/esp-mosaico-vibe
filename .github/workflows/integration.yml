name: Hello World integration

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ESP_IDF_REVISION: 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hello-world:
    name: Hello World build and simulation
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize application dependencies
        run: >-
          git -c url."https://github.com/".insteadOf=git@github.com: submodule update --init --recursive submodule/esp-mosaico-bsp submodule/esp-mosaico-utils

      - name: Create build log directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/idf-logs/hello-world"

      - name: Set up ESP-IDF Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Check out pinned ESP-IDF revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: espressif/esp-idf
          ref: ${{ env.ESP_IDF_REVISION }}
          path: .idf/esp-idf
          submodules: recursive
          persist-credentials: false

      - name: Install ESP-IDF tools
        shell: bash
        run: |
          export IDF_PATH="$GITHUB_WORKSPACE/.idf/esp-idf"
          export IDF_TOOLS_PATH="$RUNNER_TEMP/espressif"
          "$IDF_PATH/install.sh" all
          echo "IDF_PATH=$IDF_PATH" >> "$GITHUB_ENV"
          echo "IDF_TOOLS_PATH=$IDF_TOOLS_PATH" >> "$GITHUB_ENV"

      - name: Prepare pinned GSP compiler
        run: |
          python -m pip install --disable-pip-version-check esp-gsp-tools==0.1.1
          python submodule/esp-mosaico-utils/tools/ci/prepare_gsp.py --compiler-only

      - name: Verify pinned ESP-IDF revision
        shell: bash
        run: |
          if [[ -z "${IDF_PATH:-}" ]]; then
            echo "ESP-IDF installer did not export IDF_PATH"
            exit 1
          fi
          actual_revision="$(git -C "$IDF_PATH" rev-parse HEAD)"
          if [[ "$actual_revision" != "$ESP_IDF_REVISION" ]]; then
            echo "Expected ESP-IDF revision: $ESP_IDF_REVISION"
            echo "Actual ESP-IDF revision:   $actual_revision"
            exit 1
          fi

      - name: Verify ESP-IDF environment
        shell: bash
        run: >-
          python3 submodule/esp-mosaico-utils/esp-mosaico-recovery/skills/idf-low-noise-build/scripts/idf_low_noise_build.py
          --project "projects/hello_world"
          doctor

      - name: Build firmware
        shell: bash
        run: >-
          python3 submodule/esp-mosaico-utils/esp-mosaico-recovery/skills/idf-low-noise-build/scripts/idf_low_noise_build.py
          --project "projects/hello_world"
          --log-dir "$RUNNER_TEMP/idf-logs/hello-world"
          build

      - name: Build GSP PC bridge and render scene
        shell: bash
        run: |
          gsp_root="$GITHUB_WORKSPACE/projects/hello_world/managed_components/espressif__esp-gsp"
          gspc="$(python3 tools/gsp-sim/fetch_gspc.py)"
          cmake \
            -S projects/hello_world/pc \
            -B "$RUNNER_TEMP/gsp-pc-build" \
            -D "CMAKE_BUILD_TYPE=Release" \
            -D "ESP_GSP_COMPONENT_DIR=$gsp_root" \
            -D "GSPC_EXECUTABLE=$gspc"
          cmake --build "$RUNNER_TEMP/gsp-pc-build"
          python3 tests/hello_world_ui/run.py \
            --manifest "$RUNNER_TEMP/gsp-pc-build/hello_backend-Release.json" \
            --sim "$(python3 tools/gsp-sim/fetch_gspc.py --sim)" \
            --output "$RUNNER_TEMP/hello-world-ui"
          python3 tools/gsp-sim/run.py \
            --headless \
            --dump-ppm "$RUNNER_TEMP/hello-world.ppm"
          python3 - "$RUNNER_TEMP/hello-world.ppm" <<'PY'
          from pathlib import Path
          import sys

          image = Path(sys.argv[1]).read_bytes()
          header = image.split(maxsplit=4)[:4]
          if header != [b"P6", b"480", b"480", b"255"]:
              raise SystemExit(f"unexpected PPM header: {header!r}")
          PY

      - name: Upload firmware build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-hello-world-logs
          path: ${{ runner.temp }}/idf-logs/hello-world/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-hello-world
          path: |
            projects/hello_world/build/*.bin
            projects/hello_world/build/*.elf
            projects/hello_world/build/*.map
            projects/hello_world/build/*.irisfw
            projects/hello_world/build/sdkconfig
            projects/hello_world/build/bootloader/*.bin
            projects/hello_world/build/partition_table/*.bin
          if-no-files-found: error
          retention-days: 14

      - name: Upload GSP interaction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-hello-world-ui-evidence
          path: ${{ runner.temp }}/hello-world-ui/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload GSP screenshot
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-hello-world-screenshot
          path: ${{ runner.temp }}/hello-world.ppm
          if-no-files-found: error
          retention-days: 14
