name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Preserve the existing required check name for branch protection.
  required:
    name: required
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize launcher dependency
        run: >-
          git -c url."https://github.com/".insteadOf=git@github.com: submodule update --init submodule/esp-mosaico-utils

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Check repository launcher
        run: python mosaico.py --version

      - name: Check workspace configuration and project initialization
        run: python -m unittest discover -s tests/mosaico_cli_integration -v
