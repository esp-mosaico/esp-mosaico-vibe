name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ESP_IDF_REVISION: 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-15-intel
          - windows-2022
        python:
          - "3.8"
          - "3.12"

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Make MinGW compiler available
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Create test result directory
        run: python -c "from pathlib import Path; Path('test-results').mkdir(exist_ok=True)"

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          mosaico.py
          tools
          submodule/esp-mosaico-utils/esp-mosaico-recovery/tools/mosaico_cli

      - name: Test workspace
        run: >-
          python -m pytest -q tests
          --ignore=tests/firmware
          --junitxml=test-results/workspace.xml

      - name: Test ESP-Mosaico tools
        if: runner.os != 'Windows'
        env:
          TMPDIR: ${{ runner.temp }}
        run: >-
          python -m pytest -q submodule/esp-mosaico-utils/esp-mosaico-recovery/tests
          --junitxml=test-results/tools.xml

      - name: Test ESP-Mosaico tools on Windows
        if: runner.os == 'Windows'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >-
          python -m pytest -q submodule/esp-mosaico-utils/esp-mosaico-recovery/tests
          --ignore=submodule/esp-mosaico-utils/esp-mosaico-recovery/tests/test_http_update_authorization_host.py
          --deselect=submodule/esp-mosaico-utils/esp-mosaico-recovery/tests/test_cli.py::GatewayTests::test_local_system_update_builds_and_submits_atomic_bundle
          --deselect=submodule/esp-mosaico-utils/esp-mosaico-recovery/tests/test_cli.py::HostCompatibilityTests::test_idf_environment_uses_idf_python_without_a_shell
          --deselect=submodule/esp-mosaico-utils/esp-mosaico-recovery/tests/test_cli.py::HostCompatibilityTests::test_python38_runtime_hands_idf_to_a_newer_python
          --deselect=submodule/esp-mosaico-utils/esp-mosaico-recovery/tests/test_cli.py::RecoveryCommandTests::test_idf_wrapper_reports_bounded_cmake_diagnostic
          --junitxml=test-results/tools.xml

      - name: Check repository launcher
        run: python mosaico.py --version

      - name: Upload host test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-${{ matrix.os }}-python-${{ matrix.python }}
          path: test-results/*.xml
          if-no-files-found: error
          retention-days: 14

  firmware-builds:
    name: Firmware / ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hello-world
            project: projects/hello_world
          - name: gsp-hello
            project: projects/gsp_hello
          - name: iris-acceptance
            project: tests/firmware/iris_acceptance
          - name: recovery
            project: submodule/esp-mosaico-utils/esp-mosaico-recovery/firmware/recovery

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Create build log directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/idf-logs/${{ matrix.name }}"

      - name: Set up ESP-IDF Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Check out pinned ESP-IDF revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: espressif/esp-idf
          ref: ${{ env.ESP_IDF_REVISION }}
          path: .idf/esp-idf
          submodules: recursive
          persist-credentials: false

      - name: Install ESP-IDF tools
        shell: bash
        run: |
          export IDF_PATH="$GITHUB_WORKSPACE/.idf/esp-idf"
          export IDF_TOOLS_PATH="$RUNNER_TEMP/espressif"
          "$IDF_PATH/install.sh" all
          echo "IDF_PATH=$IDF_PATH" >> "$GITHUB_ENV"
          echo "IDF_TOOLS_PATH=$IDF_TOOLS_PATH" >> "$GITHUB_ENV"

      - name: Verify pinned ESP-IDF revision
        shell: bash
        run: |
          if [[ -z "${IDF_PATH:-}" ]]; then
            echo "ESP-IDF installer did not export IDF_PATH"
            exit 1
          fi
          actual_revision="$(git -C "$IDF_PATH" rev-parse HEAD)"
          if [[ "$actual_revision" != "$ESP_IDF_REVISION" ]]; then
            echo "Expected ESP-IDF revision: $ESP_IDF_REVISION"
            echo "Actual ESP-IDF revision:   $actual_revision"
            exit 1
          fi

      - name: Verify ESP-IDF environment
        shell: bash
        run: >-
          python3 submodule/esp-mosaico-utils/esp-mosaico-recovery/skills/idf-low-noise-build/scripts/idf_low_noise_build.py
          --project "${{ matrix.project }}"
          doctor

      - name: Build firmware
        shell: bash
        run: >-
          python3 submodule/esp-mosaico-utils/esp-mosaico-recovery/skills/idf-low-noise-build/scripts/idf_low_noise_build.py
          --project "${{ matrix.project }}"
          --log-dir "$RUNNER_TEMP/idf-logs/${{ matrix.name }}"
          build

      - name: Build GSP PC bridge and render scene
        if: matrix.name == 'gsp-hello'
        shell: bash
        run: |
          gsp_root="$GITHUB_WORKSPACE/projects/gsp_hello/managed_components/espressif__esp-gsp"
          gspc="$(python3 tools/gsp-sim/fetch_gspc.py)"
          cmake \
            -S projects/gsp_hello/pc \
            -B "$RUNNER_TEMP/gsp-pc-build" \
            -D "ESP_GSP_COMPONENT_DIR=$gsp_root" \
            -D "GSPC_EXECUTABLE=$gspc"
          cmake --build "$RUNNER_TEMP/gsp-pc-build"
          python3 tools/gsp-sim/run.py \
            --headless \
            --dump-ppm "$RUNNER_TEMP/gsp-hello.ppm"
          python3 - "$RUNNER_TEMP/gsp-hello.ppm" <<'PY'
          from pathlib import Path
          import sys

          image = Path(sys.argv[1]).read_bytes()
          header = image.split(maxsplit=4)[:4]
          if header != [b"P6", b"480", b"480", b"255"]:
              raise SystemExit(f"unexpected PPM header: {header!r}")
          PY

      - name: Upload firmware build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-${{ matrix.name }}-logs
          path: ${{ runner.temp }}/idf-logs/${{ matrix.name }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-${{ matrix.name }}
          path: |
            ${{ matrix.project }}/build/*.bin
            ${{ matrix.project }}/build/*.elf
            ${{ matrix.project }}/build/*.map
            ${{ matrix.project }}/build/*.irisfw
            ${{ matrix.project }}/build/sdkconfig
            ${{ matrix.project }}/build/bootloader/*.bin
            ${{ matrix.project }}/build/partition_table/*.bin
          if-no-files-found: error
          retention-days: 14

      - name: Upload GSP screenshot
        if: success() && matrix.name == 'gsp-hello'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-${{ matrix.name }}-screenshot
          path: ${{ runner.temp }}/gsp-hello.ppm
          if-no-files-found: error
          retention-days: 14

  required:
    name: required
    if: always()
    needs:
      - host-tests
      - firmware-builds
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        shell: bash
        env:
          HOST_RESULT: ${{ needs.host-tests.result }}
          FIRMWARE_RESULT: ${{ needs.firmware-builds.result }}
        run: |
          if [[ "$HOST_RESULT" != "success" || "$FIRMWARE_RESULT" != "success" ]]; then
            echo "Host tests: $HOST_RESULT"
            echo "Firmware builds: $FIRMWARE_RESULT"
            exit 1
          fi
