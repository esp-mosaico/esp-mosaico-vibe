# Shared buses and rails; revision-specific pins are selected before init.
version: 1.0.0
peripherals:
- name: i2c_master
  type: i2c
  role: master
  config:
    port: 0
    pins:
      sda: 0
      scl: 1
- name: spi_display
  type: spi
  role: master
  config:
    spi_bus_config:
      spi_port: SPI2_HOST
      sclk_io_num: 44
      data0_io_num: 36
      data1_io_num: 51
      data2_io_num: 35
      data3_io_num: 9
      max_transfer_sz: 32640
- name: gpio_lcd_en
  type: gpio
  role: io
  config:
    pin: 60
    mode: GPIO_MODE_OUTPUT
    default_level: 0
- name: i2s_audio_out
  type: i2s
  role: master
  format: std-out
  config:
    port: 0
    sample_rate_hz: 24000
    clk_src: I2S_CLK_SRC_DEFAULT
    mclk_multiple: 256
    data_bit_width: 16
    slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
    slot_mode: I2S_SLOT_MODE_STEREO
    slot_mask: I2S_STD_SLOT_BOTH
    ws_width: 16
    pins:
      mclk: 54
      bclk: 37
      ws: 49
      dout: 52
      din: -1
- name: gpio_pa_control
  type: gpio
  role: io
  config:
    pin: 45
    mode: GPIO_MODE_OUTPUT
    default_level: 0
- name: ledc_vibration_motor
  type: ledc
  version: default
  config:
    gpio_num: 8
    speed_mode: LEDC_LOW_SPEED_MODE
    channel: 1
    timer_sel: 1
    duty: 0
    freq_hz: 20000
    duty_resolution: LEDC_TIMER_10_BIT
