<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MOSAICO / LAST ZONE: EXTRACTION</title>
<style>
:root{color-scheme:dark;--ink:#edf4f3;--muted:#829397;--accent:#ffdb55}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#090e12;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:28px 16px}
button,select{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,select:focus-visible{outline:2px solid #ffe68a;outline-offset:3px}
main{width:480px;max-width:100%}
.outside{display:flex;align-items:center;justify-content:space-between;margin:0 0 19px;font-size:11px;letter-spacing:.18em;color:#849497}
.outside b{font-weight:500;color:#c9c1a5;letter-spacing:.04em}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.tools button,.tools select{border:1px solid #eadb9d29;background:#15130c88;border-radius:18px;padding:8px 14px;color:#ded8c4}
.tools button:hover,.tools select:hover{background:#ffe7801a}.tools select{appearance:none}
.screen{width:480px;height:480px;max-width:100%;aspect-ratio:1/1;position:relative;background:#071016;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;isolation:isolate;border-radius:60px;clip-path:inset(0 round 60px);box-shadow:0 26px 80px #0009;outline:1px solid #28251c;transform:translateZ(0)}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;image-rendering:pixelated;touch-action:none;cursor:crosshair;border-radius:inherit;clip-path:inherit}
#offline{position:absolute;inset:0;z-index:4;display:none;place-items:center;background:#070b0ecf;pointer-events:none;text-align:center;padding:24px}
#offline.visible{display:grid}#offline p{margin:0;font-size:16px;color:#f0ead8}#offline small{color:var(--muted);margin-top:8px}
.helpOutside{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:16px 2px 0;color:#9aabb0;font-size:13px}
.helpOutside strong{color:#ebe1bc;font-weight:550}.instructions{margin:8px 2px 0;color:#7f9094;font-size:13px;line-height:1.55}.meta{margin-top:12px;color:#6f8388;font-size:12px;letter-spacing:.04em}
</style>
</head>
<body>
<main>
  <div class="outside"><span>MOSAICO / LAST ZONE: EXTRACTION</span><b id="eyebrow">60° · 480 × 480</b></div>
  <div class="tools">
    <button id="pause" type="button">Pause</button><button id="step" type="button">Step</button><button id="reset" type="button">Reset</button><button id="shot" type="button">Screenshot</button><button id="record" type="button">Record</button>
    <select id="speed" aria-label="Simulation speed"><option>.25</option><option>.5</option><option selected>1</option><option>2</option></select>
  </div>
  <section class="screen" aria-label="Last Zone: Extraction 可交互游戏画面">
    <img id="world" width="480" height="480" alt="Last Zone: Extraction" draggable="false" tabindex="0">
    <div id="offline" role="status"><div><p>正在连接仿真</p><small>共享源码 RGB565 实时渲染</small></div></div>
  </section>
  <div class="helpOutside"><strong id="mission">任务 1 / DOCK</strong><span id="heading">heading 0° · pitch 0°</span></div>
  <div class="instructions">W/S 移动，A/D 转向，Q/E 横移，Shift 冲刺，F 开火。触控：左侧移动，右侧观察与开火。</div>
  <div class="meta" id="status">等待第一帧</div>
</main>
<script>
const img=document.querySelector('#world'),offline=document.querySelector('#offline'),mission=document.querySelector('#mission'),heading=document.querySelector('#heading'),status=document.querySelector('#status');
const pauseButton=document.querySelector('#pause'),recordButton=document.querySelector('#record');
const held=new Set(),pointers=new Map(),sfxCache={};let busy=false,paused=false,lastBlob='',armedSfx='';
function playSfx(name){if(!name)return;let audio=sfxCache[name];if(!audio){audio=new Audio('/sfx/'+name+'.wav');audio.preload='auto';sfxCache[name]=audio}audio.currentTime=0;audio.volume=name.startsWith('step')?.35:.7;audio.play().catch(()=>{})}
function unlockAudio(){if(sfxCache._on)return;sfxCache._on=1;['rifle','step_l','alert','hurt','confirm'].forEach(name=>{const audio=new Audio('/sfx/'+name+'.wav');audio.preload='auto';sfxCache[name]=audio})}
function pointerFromEvent(event){const box=img.getBoundingClientRect();return{track:event.pointerId,x:(event.clientX-box.left)*480/Math.max(1,box.width),y:(event.clientY-box.top)*480/Math.max(1,box.height)}}
async function sendInput(){const left=held.has('a')||held.has('arrowleft'),right=held.has('d')||held.has('arrowright'),jump=held.has('w')||held.has('arrowup'),back=held.has('s')||held.has('arrowdown'),fire=held.has('f')||held.has('control');await fetch('/api/v1/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({left,right,jump,back,fire,sprint:held.has('shift'),strafe_left:held.has('q'),strafe_right:held.has('e'),pointers:[...pointers.values()]})})}
async function control(command){await fetch('/api/v1/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command})})}
function key(event,down){unlockAudio();const key=event.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown','a','d','w','s','f','control','shift','q','e','p','enter'].includes(key))event.preventDefault();if(down&&!held.has(key)&&key==='p')control(paused?'resume':'pause');if(down&&!held.has(key)&&key==='enter')control('step');down?held.add(key):held.delete(key);sendInput()}
addEventListener('keydown',event=>key(event,true));addEventListener('keyup',event=>key(event,false));
img.addEventListener('pointerdown',event=>{event.preventDefault();unlockAudio();img.focus();img.setPointerCapture(event.pointerId);pointers.set(event.pointerId,pointerFromEvent(event));sendInput()});
img.addEventListener('pointermove',event=>{if(!pointers.has(event.pointerId))return;event.preventDefault();pointers.set(event.pointerId,pointerFromEvent(event));sendInput()});
function release(event){if(!pointers.has(event.pointerId))return;pointers.delete(event.pointerId);sendInput()}
img.addEventListener('pointerup',release);img.addEventListener('pointercancel',release);addEventListener('blur',()=>{held.clear();pointers.clear();sendInput()});
pauseButton.onclick=()=>control(paused?'resume':'pause');document.querySelector('#step').onclick=()=>control('step');document.querySelector('#reset').onclick=()=>control('reset');document.querySelector('#speed').onchange=event=>control('speed:'+event.target.value);
document.querySelector('#shot').onclick=()=>{const canvas=document.createElement('canvas'),context=canvas.getContext('2d');canvas.width=canvas.height=480;context.beginPath();context.roundRect(0,0,480,480,60);context.clip();context.drawImage(img,0,0,480,480);const link=document.createElement('a');link.href=canvas.toDataURL('image/png');link.download='last-zone-extraction.png';link.click()};
recordButton.onclick=async()=>{await control('record');if(recordButton.textContent==='Record')recordButton.textContent='Stop record';else{const link=document.createElement('a');link.href='/api/v1/recording';link.download='scenario.json';link.click();recordButton.textContent='Record'}};
function applyMeta(meta){paused=!!(meta.simulation&&meta.simulation.paused);pauseButton.textContent=paused?'Resume':'Pause';const layouts=['DOCK','DEPOT','COMMAND','GHOST','RUN'];const layout=Number(meta.layout||0);mission.textContent='任务 '+(layout+1)+' / '+(layouts[layout]||'DOCK');heading.textContent='heading '+Number(meta.heading||0).toFixed(0)+'° · pitch '+Number(meta.pitch||0).toFixed(0)+'°';const fps=meta.simulation&&meta.simulation.logic_fps,render=Number(meta.host_render_ms||0);status.textContent=(Number.isFinite(fps)?fps.toFixed(0)+' Hz · ':'')+render.toFixed(2)+' ms · enemy '+Number(meta.alive||0)+' · HP '+Number(meta.hp||0)+' · ammo '+Number(meta.ammo||0)+(meta.reload_error?' · '+meta.reload_error:'');if(meta.sfx&&meta.sfx!==armedSfx)playSfx(meta.sfx);armedSfx=meta.sfx||''}
async function tick(){if(busy)return;busy=true;try{const response=await fetch('/api/v1/frame',{cache:'no-store'});if(!response.ok)throw new Error('frame '+response.status);const header=response.headers.get('X-Mosaico-State');if(header)applyMeta(JSON.parse(header));const blob=await response.blob(),url=URL.createObjectURL(blob);img.onload=()=>{if(lastBlob)URL.revokeObjectURL(lastBlob);lastBlob=url;img.onload=null};img.src=url;offline.classList.remove('visible')}catch(error){offline.classList.add('visible');status.textContent='仿真断开，正在重连'}finally{busy=false}}
let lastFrame=0;function animate(now){if(now-lastFrame>=32){lastFrame=now;tick()}requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script>
</body>
</html>
